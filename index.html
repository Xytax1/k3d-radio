<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K3D Rádió</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome ikonok -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Retro Pixel Betűtípus -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        * {
            image-rendering: pixelated;
            font-family: 'Press Start 2P', monospace;
            user-select: none;
        }

        body {
            background-color: #0b0e14;
            min-height: 100vh;
        }

        .mc-card {
            background-color: #866043;
            background-image: url('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/block/dirt.png');
            background-size: 32px 32px;
            border: 5px solid #000000;
            box-shadow: 8px 8px 0px 0px #000000;
        }

        .mc-header {
            background-color: #5c8e32;
            background-image: url('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/block/grass_block_top.png');
            background-size: 32px 32px;
            filter: sepia(1) hue-rotate(50deg) saturate(3) brightness(0.8);
            border-bottom: 5px solid #000000;
        }

        .mc-inner-box {
            background-color: #1e1e1e;
            background-image: url('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/block/deepslate.png');
            background-size: 32px 32px;
            border: 4px solid #000000;
        }

        .btn-mc-play {
            background: #a80000;
            background-image: url('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/block/redstone_block.png');
            background-size: 32px 32px;
            border: 4px solid #000000;
            color: #ffffff;
            text-shadow: 2px 2px #000000;
        }
        .btn-mc-play:hover { filter: brightness(1.2); }

        .btn-mc-stop {
            background: #008b8b;
            background-image: url('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/block/diamond_block.png');
            background-size: 32px 32px;
            border: 4px solid #000000;
            color: #ffffff;
            text-shadow: 2px 2px #000000;
        }
        .btn-mc-stop:hover { filter: brightness(1.2); }

        .speed-btn {
            background-color: #111111;
            border: 2px solid #000;
            color: #aaa;
            font-size: 9px;
            padding: 8px 10px;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }
        .speed-btn.active {
            background-color: #55ff55;
            color: #000;
            border-color: #ffffff;
            font-weight: bold;
        }

        .mc-eq-bar {
            width: 14px;
            height: 14px;
            background-color: #444444;
            border: 1px solid #000000;
        }

        .playing .mc-eq-bar:nth-child(1) { animation: mc-eq 0.6s infinite alternate steps(2); }
        .playing .mc-eq-bar:nth-child(2) { animation: mc-eq 0.8s infinite alternate steps(3) 0.2s; }
        .playing .mc-eq-bar:nth-child(3) { animation: mc-eq 0.5s infinite alternate steps(2) 0.1s; }
        .playing .mc-eq-bar:nth-child(4) { animation: mc-eq 0.9s infinite alternate steps(3) 0.3s; }
        .playing .mc-eq-bar:nth-child(5) { animation: mc-eq 0.7s infinite alternate steps(2) 0.15s; }

        @keyframes mc-eq {
            0% { background-color: #55ff55; }
            50% { background-color: #ffff55; }
            100% { background-color: #ff5555; }
        }

        input[type=range] {
            -webkit-appearance: none;
            background: #111111;
            border: 2px solid #000000;
            height: 10px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 22px;
            width: 12px;
            background: #55ff55;
            border: 2px solid #000000;
            cursor: pointer;
        }

        #youtube-player-container {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <!-- Rejtett YouTube Lejátszó -->
    <div id="youtube-player-container">
        <div id="yt-player"></div>
    </div>

    <!-- Rádió Konténer -->
    <div class="mc-card w-full max-w-md text-white text-center relative my-4">
        
        <!-- Valós Idejű Hallgatószám -->
        <div class="absolute top-3 right-3 bg-black/80 border-2 border-black px-2.5 py-1.5 flex items-center gap-2 z-10">
            <span class="inline-block w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
            <span class="text-[9px] text-gray-300"><i class="fa-solid fa-user text-xs text-yellow-400 mr-1"></i><span id="listener-count">1</span></span>
        </div>

        <!-- Fejléc -->
        <div class="mc-header py-7 px-6 text-left">
            <h1 class="text-xl sm:text-2xl text-yellow-300 tracking-wider drop-shadow-[3px_3px_0_#000]">
                K3D RÁDIÓ
            </h1>
        </div>

        <div class="p-6">
            <div class="mc-inner-box p-5 mb-5 text-center">
                <div class="text-[10px] text-gray-400 uppercase mb-3">JUKEBOX LEJÁTSZÓ</div>
                <div id="playlist-title" class="text-xs sm:text-sm text-yellow-400 truncate mb-3">
                    Készenlétben
                </div>
                <div id="status-text" class="text-[10px] text-gray-300 flex items-center justify-center gap-2 mb-4">
                    <span class="text-yellow-400">■</span>
                    <span>Kattints a lejátszásra!</span>
                </div>

                <!-- Ekvalizer -->
                <div id="equalizer" class="flex items-center justify-center gap-3 h-12 bg-[#111111] p-2 border-2 border-black">
                    <div class="mc-eq-bar"></div>
                    <div class="mc-eq-bar"></div>
                    <div class="mc-eq-bar"></div>
                    <div class="mc-eq-bar"></div>
                    <div class="mc-eq-bar"></div>
                </div>

                <!-- Tekerő csúszka -->
                <div id="seek-container" class="hidden bg-[#111111] p-3 border-2 border-black">
                    <input type="range" id="seek-slider" min="0" max="100" value="0" step="0.1" class="w-full cursor-pointer mb-2">
                    <div class="flex justify-between text-[9px] text-gray-300">
                        <span id="current-time">00:00</span>
                        <span id="duration-time">00:00</span>
                    </div>
                </div>
            </div>

            <!-- Sebesség -->
            <div class="mb-5 text-left">
                <span class="block text-[10px] text-yellow-300 mb-2 drop-shadow-[1px_1px_0_#000]">SEBESSÉG:</span>
                <div class="flex gap-2">
                    <button class="speed-btn" onclick="setPlaybackSpeed(0.5, this)">0.5x</button>
                    <button class="speed-btn active" onclick="setPlaybackSpeed(1.0, this)">1.0x</button>
                    <button class="speed-btn" onclick="setPlaybackSpeed(1.5, this)">1.5x</button>
                    <button class="speed-btn" onclick="setPlaybackSpeed(2.0, this)">2.0x</button>
                </div>
            </div>

            <!-- Lejátszás Gomb -->
            <div class="mb-5">
                <button id="main-toggle-btn" class="btn-mc-play w-full py-4 px-5 cursor-pointer flex items-center justify-center gap-3 text-sm">
                    <i id="btn-icon" class="fa-solid fa-play"></i>
                    <span id="btn-text">LEJÁTSZÁS</span>
                </button>
            </div>

            <!-- Hangerő -->
            <div class="mc-inner-box p-3.5 flex items-center gap-3">
                <button id="mute-btn" class="text-gray-300 hover:text-white cursor-pointer w-6 text-center">
                    <i id="mute-icon" class="fa-solid fa-volume-high text-sm"></i>
                </button>
                <input type="range" id="volume-slider" min="0" max="100" step="1" value="80" class="w-full cursor-pointer">
            </div>
        </div>
    </div>

    <!-- YouTube API JS -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <!-- Firebase SDK-k -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBzKOcbb-nY_P9EK-QrkTjHg2BEY3plrQ4",
          authDomain: "k3d-radio.firebaseapp.com",
          databaseURL: "https://k3d-radio-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "k3d-radio",
          storageBucket: "k3d-radio.firebasestorage.app",
          messagingSenderId: "680406397835",
          appId: "1:680406397835:web:f701d8bf8678ecfc04f58e"
        };

        let db, radioStateRef;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            const listenerRef = db.ref('active_listeners');
            const connectedRef = db.ref('.info/connected');

            connectedRef.on('value', (snap) => {
                if (snap.val() === true) {
                    const myConnectionRef = listenerRef.push();
                    myConnectionRef.onDisconnect().remove();
                    myConnectionRef.set(true);
                }
            });

            listenerRef.on('value', (snap) => {
                const count = snap.numChildren();
                document.getElementById('listener-count').textContent = count > 0 ? count : 1;
            });

            radioStateRef = db.ref('radio_state');
        } catch (e) {
            document.getElementById('listener-count').textContent = "1";
        }

        const tracks = [
            { type: 'yt', name: '🇭🇺 C418 - Sweden (Minecraft OST)', id: 'aBkTkxKDduc' },
            { type: 'yt', name: '🇭🇺 Tankcsapda - Mennyország tourist', id: '270yvW1_l-E' },
            { type: 'yt', name: '🇭🇺 Halott Pénz - Valami van a levegőben', id: '9kZ_q71p_J4' },
            { type: 'yt', name: '🇭🇺 Wellhello - Apuveddmeg', id: '1w7Xw73W4Bc' },
            { type: 'yt', name: '🇭🇺 Bagossy Brothers Company - Olyan Ő', id: '7oJ4HnLq2M8' },
            { type: 'yt', name: '🇭🇺 Majka & Curtis - Belehalok', id: '4H1W7k8gQ1o' },
            { type: 'yt', name: '🇭🇺 Kowalsky meg a Vega - Varázsvilág', id: '0N6w0J8m4rQ' },
            { type: 'yt', name: '🇭🇺 Margaret Island - Eső', id: '3vK1x9Z9W8c' },
            { type: 'yt', name: '🇭🇺 Quimby - Most múlik pontosan', id: '9Q4x2w1_1kE' },
            { type: 'yt', name: '🇬🇧 Coldplay - Viva La Vida', id: 'dvgZkm7_0eM' },
            { type: 'yt', name: '🇬🇧 Imagine Dragons - Believer', id: '7qu1nvxaA0I' },
            { type: 'yt', name: '🇬🇧 Ed Sheeran - Shape of You', id: 'JGwWNGJdvx8' },
            { type: 'yt', name: '🇬🇧 Avicii - Wake Me Up', id: 'IcrbM1l_BoI' },
            { type: 'yt', name: '🇬🇧 Queen - Bohemian Rhapsody', id: 'fJ9rUzIMcZQ' },
            { type: 'yt', name: '🇬🇧 Daft Punk - Get Lucky', id: '5NV6Rdv1a3I' },
            { type: 'yt', name: '🇬🇧 The Weeknd - Blinding Lights', id: '4NRXx6U8ABQ' },
            { type: 'yt', name: '🇬🇧 OneRepublic - Counting Stars', id: 'hT_nvWreIhg' }
        ];

        let ytPlayer = null;
        let currentTrackIndex = 0;
        let isPlaying = false;
        let isMuted = false;
        let currentSpeed = 1.0;
        let previousVolume = 80;
        let isSeeking = false;
        let progressInterval = null;
        let isInitialized = false;

        const playlistTitle = document.getElementById('playlist-title');
        const statusText = document.getElementById('status-text');
        const mainToggleBtn = document.getElementById('main-toggle-btn');
        const btnIcon = document.getElementById('btn-icon');
        const btnText = document.getElementById('btn-text');
        const volumeSlider = document.getElementById('volume-slider');
        const muteBtn = document.getElementById('mute-btn');
        const muteIcon = document.getElementById('mute-icon');

        const equalizer = document.getElementById('equalizer');
        const seekContainer = document.getElementById('seek-container');
        const seekSlider = document.getElementById('seek-slider');
        const currentTimeEl = document.getElementById('current-time');
        const durationTimeEl = document.getElementById('duration-time');

        function initApp() {
            if (isInitialized) return;
            isInitialized = true;
            if (radioStateRef) {
                radioStateRef.on('value', (snapshot) => {
                    const state = snapshot.val();
                    if (state) {
                        syncWithServerState(state);
                    } else {
                        pickAndBroadcastNewTrack();
                    }
                });
            } else {
                updateTrackDisplay(0);
            }
        }

        function pickAndBroadcastNewTrack() {
            const newIndex = Math.floor(Math.random() * tracks.length);
            const newState = {
                trackIndex: newIndex,
                startTime: Date.now()
            };
            if (radioStateRef) {
                radioStateRef.set(newState);
            }
        }

        function syncWithServerState(state) {
            currentTrackIndex = state.trackIndex;
            if (currentTrackIndex >= tracks.length) currentTrackIndex = 0;
            updateTrackDisplay(currentTrackIndex);

            const track = tracks[currentTrackIndex];
            const elapsedSec = (Date.now() - state.startTime) / 1000;

            if (isPlaying && ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
                ytPlayer.loadVideoById({videoId: track.id, startSeconds: elapsedSec});
                ytPlayer.setPlaybackRate(currentSpeed);
                ytPlayer.setVolume(volumeSlider.value);
                ytPlayer.playVideo();
            }
        }

        function onYouTubeIframeAPIReady() {
            try {
                ytPlayer = new YT.Player('yt-player', {
                    height: '200',
                    width: '200',
                    videoId: tracks[0].id || '',
                    playerVars: { 'autoplay': 0, 'controls': 0 },
                    events: {
                        'onStateChange': onPlayerStateChange,
                        'onError': onPlayerError
                    }
                });
            } catch (e) {}
            initApp();
        }

        function updateTrackDisplay(index) {
            currentTrackIndex = parseInt(index);
            const track = tracks[currentTrackIndex];
            playlistTitle.textContent = track.name;

            equalizer.classList.add('hidden');
            seekContainer.classList.remove('hidden');
            seekSlider.value = 0;
            currentTimeEl.textContent = "00:00";
            durationTimeEl.textContent = "00:00";
        }

        function playClickSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.05);
            } catch (e) {}
        }

        function startPlayback() {
            const track = tracks[currentTrackIndex];
            statusText.innerHTML = `<span class="text-cyan-400">Csatlakozás...</span>`;

            if (radioStateRef) {
                radioStateRef.once('value', (snapshot) => {
                    const state = snapshot.val();
                    let elapsedSec = 0;
                    if (state && state.startTime) {
                        elapsedSec = (Date.now() - state.startTime) / 1000;
                    }

                    if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
                        try {
                            ytPlayer.loadVideoById({videoId: track.id, startSeconds: elapsedSec > 0 ? elapsedSec : 0});
                            ytPlayer.setPlaybackRate(currentSpeed);
                            ytPlayer.setVolume(volumeSlider.value);
                            ytPlayer.playVideo();
                        } catch (e) {
                            statusText.innerHTML = `<span class="text-orange-400">Kattints a Lejátszásra!</span>`;
                        }
                    }
                });
            }
            startProgressUpdate();
        }

        function stopPlayback() {
            if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
            isPlaying = false;
            updateUIState(false);
            stopProgressUpdate();
        }

        function togglePlayback() {
            playClickSound();
            if (isPlaying) stopPlayback();
            else startPlayback();
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                updateUIState(true);
                startProgressUpdate();
            } else if (event.data === YT.PlayerState.PAUSED) {
                isPlaying = false;
                updateUIState(false);
                stopProgressUpdate();
            } else if (event.data === YT.PlayerState.ENDED) {
                if (radioStateRef) {
                    pickAndBroadcastNewTrack();
                }
            }
        }

        function onPlayerError() {
            statusText.innerHTML = `<span class="text-red-400">Hiba! Újratöltés...</span>`;
            if (radioStateRef) {
                pickAndBroadcastNewTrack();
            }
        }

        function updateUIState(playing) {
            if (playing) {
                mainToggleBtn.classList.remove('btn-mc-play');
                mainToggleBtn.classList.add('btn-mc-stop');
                btnIcon.className = 'fa-solid fa-square';
                btnText.textContent = 'LEÁLLÍTÁS';
                statusText.innerHTML = `<span class="text-green-400">K3D RÁDIÓ SZÓL</span>`;
            } else {
                mainToggleBtn.classList.remove('btn-mc-stop');
                mainToggleBtn.classList.add('btn-mc-play');
                btnIcon.className = 'fa-solid fa-play';
                btnText.textContent = 'LEJÁTSZÁS';
                statusText.innerHTML = `<span class="text-yellow-400">Megállítva</span>`;
            }
        }

        function startProgressUpdate() {
            stopProgressUpdate();
            progressInterval = setInterval(updateProgress, 500);
        }

        function stopProgressUpdate() {
            if (progressInterval) clearInterval(progressInterval);
        }

        function updateProgress() {
            if (isSeeking) return;
            let current = 0;
            let duration = 0;
            if (ytPlayer && ytPlayer.getCurrentTime) {
                current = ytPlayer.getCurrentTime() || 0;
                duration = ytPlayer.getDuration() || 0;
            }
            if (duration > 0 && isFinite(duration)) {
                seekSlider.value = (current / duration) * 100;
                currentTimeEl.textContent = formatTime(current);
                durationTimeEl.textContent = formatTime(duration);
            }
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === Infinity) return "00:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        seekSlider.addEventListener('mousedown', () => isSeeking = true);
        seekSlider.addEventListener('touchstart', () => isSeeking = true);

        seekSlider.addEventListener('change', (e) => {
            const targetPercent = parseFloat(e.target.value);
            if (ytPlayer && ytPlayer.getDuration) {
                const duration = ytPlayer.getDuration();
                if (duration > 0) {
                    const seekToSec = (targetPercent / 100) * duration;
                    ytPlayer.seekTo(seekToSec, true);
                }
            }
            isSeeking = false;
        });

        function setPlaybackSpeed(speed, btnElement) {
            playClickSound();
            currentSpeed = speed;
            if (ytPlayer && ytPlayer.setPlaybackRate) {
                ytPlayer.setPlaybackRate(speed);
            }
            document.querySelectorAll('.speed-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');
        }

        mainToggleBtn.addEventListener('click', togglePlayback);

        volumeSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            if (ytPlayer && ytPlayer.setVolume) ytPlayer.setVolume(val);
            if (val == 0) {
                muteIcon.className = 'fa-solid fa-volume-xmark text-red-400 text-sm';
            } else {
                muteIcon.className = 'fa-solid fa-volume-high text-sm';
                isMuted = false;
            }
        });

        muteBtn.addEventListener('click', () => {
            playClickSound();
            isMuted = !isMuted;
            if (isMuted) {
                previousVolume = volumeSlider.value;
                volumeSlider.value = 0;
                if (ytPlayer && ytPlayer.setVolume) ytPlayer.setVolume(0);
                muteIcon.className = 'fa-solid fa-volume-xmark text-red-400 text-sm';
            } else {
                volumeSlider.value = previousVolume || 80;
                if (ytPlayer && ytPlayer.setVolume) ytPlayer.setVolume(previousVolume || 80);
                muteIcon.className = 'fa-solid fa-volume-high text-sm';
            }
        });
    </script>
</body>
</html>
