        .mc-card { background-color: #866043; background-image: url('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/block/dirt.png'); background-size: 32px 32px; border: 5px solid #000000; box-shadow: 8px 8px 0px 0px #000000; }
        .mc-header { background-color: #5c8e32; background-image: url('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/block/grass_block_top.png'); background-size: 32px 32px; filter: sepia(1) hue-rotate(50deg) saturate(3) brightness(0.8); border-bottom: 5px solid #000000; }
        .mc-inner-box { background-color: #1e1e1e; background-image: url('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/block/deepslate.png'); background-size: 32px 32px; border: 4px solid #000000; }
        .btn-mc-play { background: #a80000; background-image: url('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/block/redstone_block.png'); background-size: 32px 32px; border: 4px solid #000000; color: #ffffff; text-shadow: 2px 2px #000000; }
        .btn-mc-play:hover { filter: brightness(1.2); }
        .btn-mc-stop { background: #008b8b; background-image: url('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/block/diamond_block.png'); background-size: 32px 32px; border: 4px solid #000000; color: #ffffff; text-shadow: 2px 2px #000000; }
        .btn-mc-stop:hover { filter: brightness(1.2); }
        .speed-btn { background-color: #111111; border: 2px solid #000; color: #aaa; font-size: 9px; padding: 8px 10px; cursor: pointer; flex: 1; text-align: center; }
        .speed-btn.active { background-color: #55ff55; color: #000; border-color: #ffffff; font-weight: bold; }
        input[type=range] { -webkit-appearance: none; background: #111111; border: 2px solid #000000; height: 10px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 22px; width: 12px; background: #55ff55; border: 2px solid #000000; cursor: default; border-radius: 0px; }
        #youtube-player-container { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }
        @keyframes livePulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .live-dot { animation: livePulse 1.5s infinite; }
    </style>
</head>

        </div>
        <div class="p-6">
            <div class="mc-inner-box p-5 mb-5 text-center">
                <div class="text-[10px] text-white uppercase mb-2 [text-shadow:_1px_1px_0_#000]">JUKEBOX LEJÁTSZÓ</div>
                <div id="playlist-title" class="text-xs sm:text-sm text-yellow-400 truncate mb-3 [text-shadow:_2px_2px_0_#000]">Készenlétben</div>
                <div class="text-[10px] text-red-500 font-bold flex items-center justify-center gap-1 [text-shadow:_1px_1px_0_#000]">
                    <span class="live-dot">●</span> ÉLŐ RÁDIÓ
                </div>
            </div>

            <div class="mb-5 text-left">
                <span class="block text-[10px] text-yellow-300 mb-2 [text-shadow:_1px_1px_0_#000]">SEBESSÉG:</span>
                <div class="flex gap-2">
                    <button class="speed-btn" onclick="setPlaybackSpeed(0.5, this)">0.5x</button>
                    <button class="speed-btn active" onclick="setPlaybackSpeed(1.0, this)">1.0x</button>
                    <button class="speed-btn" onclick="setPlaybackSpeed(1.5, this)">1.5x</button>
                    <button class="speed-btn" onclick="setPlaybackSpeed(2.0, this)">2.0x</button>
                </div>
            </div>

            <div class="mb-5">
                <button id="main-toggle-btn" class="btn-mc-play w-full py-4 px-5 cursor-pointer flex items-center justify-center gap-3 text-sm">
                    <i id="btn-icon" class="fa-solid fa-play"></i> <span id="btn-text">LEJÁTSZÁS</span>
                </button>
            </div>

            <div class="mc-inner-box p-3.5 flex items-center gap-3">
                <button id="mute-btn" class="text-gray-300 hover:text-white cursor-pointer w-6 text-center">
                    <i id="mute-icon" class="fa-solid fa-volume-high text-sm"></i>
                </button>
                <input type="range" id="volume-slider" min="0" max="100" step="1" value="80" class="w-full cursor-pointer">
            </div>
        </div>
    </div>

        ];

        let ytPlayer = null, isPlaying = false, isPaused = false, isMuted = false, currentSpeed = 1.0, previousVolume = 80;
        const playlistTitle = document.getElementById('playlist-title'), mainToggleBtn = document.getElementById('main-toggle-btn'), btnIcon = document.getElementById('btn-icon'), btnText = document.getElementById('btn-text'), volumeSlider = document.getElementById('volume-slider'), muteBtn = document.getElementById('mute-btn'), muteIcon = document.getElementById('mute-icon');

        function onYouTubeIframeAPIReady() { ytPlayer = new YT.Player('yt-player', { height: '200', width: '200', playerVars: { 'autoplay': 0, 'controls': 0 }, events: { 'onStateChange': onPlayerStateChange, 'onError': onPlayerError } }); }

        function startPlayback() {
            if (!ytPlayer) return;
            if (isPaused) { ytPlayer.playVideo(); isPaused = false; }
            else {
                const track = tracks[Math.floor(Math.random() * tracks.length)];
                playlistTitle.textContent = track.name;
                ytPlayer.loadVideoById(track.id);
                ytPlayer.setPlaybackRate(currentSpeed);
                ytPlayer.setVolume(volumeSlider.value);
                ytPlayer.playVideo();
            }
            isPlaying = true;
            updateUIState(true);
        }

        function stopPlayback() { ytPlayer.pauseVideo(); isPlaying = false; isPaused = true; updateUIState(false); }
        function togglePlayback() { isPlaying ? stopPlayback() : startPlayback(); }
        function onPlayerStateChange(e) { if (e.data === YT.PlayerState.ENDED) startPlayback(); }
        function onPlayerError() { startPlayback(); }
        function updateUIState(playing) {
            if (playing) { mainToggleBtn.classList.replace('btn-mc-play', 'btn-mc-stop'); btnIcon.className = 'fa-solid fa-square'; btnText.textContent = 'LEÁLLÍTÁS'; }
            else { mainToggleBtn.classList.replace('btn-mc-stop', 'btn-mc-play'); btnIcon.className = 'fa-solid fa-play'; btnText.textContent = 'LEJÁTSZÁS'; }
        }
        function setPlaybackSpeed(s, btn) { currentSpeed = s; if (ytPlayer) ytPlayer.setPlaybackRate(s); document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
        mainToggleBtn.addEventListener('click', togglePlayback);
        volumeSlider.addEventListener('input', (e) => { const v = e.target.value; ytPlayer.setVolume(v); muteIcon.className = v == 0 ? 'fa-solid fa-volume-xmark text-red-400 text-sm' : 'fa-solid fa-volume-high text-sm'; });

</html>
