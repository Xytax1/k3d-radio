<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K3D Rádió</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { image-rendering: pixelated; font-family: 'Press Start 2P', monospace; user-select: none; }
        body { background-color: #0b0e14; min-height: 100vh; }
        .mc-card { background-color: #866043; background-image: url('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/block/dirt.png'); background-size: 32px 32px; border: 5px solid #000000; box-shadow: 8px 8px 0px 0px #000000; }
        .mc-header { background-color: #5c8e32; background-image: url('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/block/grass_block_top.png'); background-size: 32px 32px; filter: sepia(1) hue-rotate(50deg) saturate(3) brightness(0.8); border-bottom: 5px solid #000000; }
        .mc-inner-box { background-color: #1e1e1e; background-image: url('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/block/deepslate.png'); background-size: 32px 32px; border: 4px solid #000000; }
        .btn-mc-play { background: #a80000; background-image: url('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/block/redstone_block.png'); background-size: 32px 32px; border: 4px solid #000000; color: #ffffff; text-shadow: 2px 2px #000000; }
        .btn-mc-play:hover { filter: brightness(1.2); }
        .btn-mc-stop { background: #008b8b; background-image: url('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/block/diamond_block.png'); background-size: 32px 32px; border: 4px solid #000000; color: #ffffff; text-shadow: 2px 2px #000000; }
        .btn-mc-stop:hover { filter: brightness(1.2); }
        .speed-btn { background-color: #111111; border: 2px solid #000; color: #aaa; font-size: 9px; padding: 8px 10px; cursor: pointer; flex: 1; text-align: center; }
        .speed-btn.active { background-color: #55ff55; color: #000; border-color: #ffffff; font-weight: bold; }
        .mc-eq-bar { width: 14px; height: 14px; background-color: #444444; border: 1px solid #000000; }
        .playing .mc-eq-bar:nth-child(1) { animation: mc-eq 0.6s infinite alternate steps(2); }
        .playing .mc-eq-bar:nth-child(2) { animation: mc-eq 0.8s infinite alternate steps(3) 0.2s; }
        .playing .mc-eq-bar:nth-child(3) { animation: mc-eq 0.5s infinite alternate steps(2) 0.1s; }
        .playing .mc-eq-bar:nth-child(4) { animation: mc-eq 0.9s infinite alternate steps(3) 0.3s; }
        .playing .mc-eq-bar:nth-child(5) { animation: mc-eq 0.7s infinite alternate steps(2) 0.15s; }
        @keyframes mc-eq { 0% { background-color: #55ff55; } 50% { background-color: #ffff55; } 100% { background-color: #ff5555; } }
        input[type=range] { -webkit-appearance: none; background: #111111; border: 2px solid #000000; height: 10px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 22px; width: 12px; background: #55ff55; border: 2px solid #000000; cursor: pointer; }
        #youtube-player-container { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div id="youtube-player-container"><div id="yt-player"></div></div>
    <div class="mc-card w-full max-w-md text-white text-center relative my-4">
        <div class="absolute top-3 right-3 bg-black/80 border-2 border-black px-2.5 py-1.5 flex items-center gap-2 z-10">
            <span class="inline-block w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
            <span class="text-[9px] text-gray-300"><i class="fa-solid fa-user text-xs text-yellow-400 mr-1"></i><span id="listener-count">1</span></span>
        </div>
        <div class="mc-header py-7 px-6 text-left">
            <h1 class="text-xl sm:text-2xl text-yellow-300 tracking-wider drop-shadow-[3px_3px_0_#000]">K3D RÁDIÓ</h1>
        </div>
        <div class="p-6">
            <div class="mc-inner-box p-5 mb-5 text-center">
                <div class="text-[10px] text-gray-400 uppercase mb-3">JUKEBOX LEJÁTSZÓ</div>
                <div id="playlist-title" class="text-xs sm:text-sm text-yellow-400 truncate mb-3">Készenlétben</div>
                <div id="status-text" class="text-[10px] text-gray-300 flex items-center justify-center gap-2 mb-4"><span class="text-yellow-400">■</span><span>Kattints a lejátszásra!</span></div>
                <div id="equalizer" class="flex items-center justify-center gap-3 h-12 bg-[#111111] p-2 border-2 border-black">
                    <div class="mc-eq-bar"></div><div class="mc-eq-bar"></div><div class="mc-eq-bar"></div><div class="mc-eq-bar"></div><div class="mc-eq-bar"></div>
                </div>
                <div id="seek-container" class="hidden bg-[#111111] p-3 border-2 border-black">
                    <input type="range" id="seek-slider" min="0" max="100" value="0" step="0.1" class="w-full cursor-pointer mb-2">
                    <div class="flex justify-between text-[9px] text-gray-300"><span id="current-time">00:00</span><span id="duration-time">00:00</span></div>
                </div>
            </div>
            <div class="mb-5 text-left">
                <span class="block text-[10px] text-yellow-300 mb-2 drop-shadow-[1px_1px_0_#000]">SEBESSÉG:</span>
                <div class="flex gap-2">
                    <button class="speed-btn" onclick="setPlaybackSpeed(0.5, this)">0.5x</button>
                    <button class="speed-btn active" onclick="setPlaybackSpeed(1.0, this)">1.0x</button>
                    <button class="speed-btn" onclick="setPlaybackSpeed(1.5, this)">1.5x</button>
                    <button class="speed-btn" onclick="setPlaybackSpeed(2.0, this)">2.0x</button>
                </div>
            </div>
            <div class="mb-5">
                <button id="main-toggle-btn" class="btn-mc-play w-full py-4 px-5 cursor-pointer flex items-center justify-center gap-3 text-sm">
                    <i id="btn-icon" class="fa-solid fa-play"></i><span id="btn-text">LEJÁTSZÁS</span>
                </button>
            </div>
            <div class="mc-inner-box p-3.5 flex items-center gap-3">
                <button id="mute-btn" class="text-gray-300 hover:text-white cursor-pointer w-6 text-center"><i id="mute-icon" class="fa-solid fa-volume-high text-sm"></i></button>
                <input type="range" id="volume-slider" min="0" max="100" step="1" value="80" class="w-full cursor-pointer">
            </div>
        </div>
    </div>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBzKOcbb-nY_P9EK-QrkTjHg2BEY3plrQ4",
          authDomain: "k3d-radio.firebaseapp.com",
          projectId: "k3d-radio",
          storageBucket: "k3d-radio.firebasestorage.app",
          messagingSenderId: "680406397835",
          appId: "1:680406397835:web:f701d8bf8678ecfc04f58e",
          measurementId: "G-8YFDF3J91X"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const listenerRef = db.ref('active_listeners');
        const radioStateRef = db.ref('radio_state');
        const tracks = [
            { type: 'yt', name: '🇭🇺 C418 - Sweden (Minecraft OST)', id: 'aBkTkxKDduc' },
            { type: 'yt', name: '🇭🇺 Tankcsapda - Mennyország tourist', id: '270yvW1_l-E' },
            { type: 'yt', name: '🇭🇺 Halott Pénz - Valami van a levegőben', id: '9kZ_q71p_J4' },
            { type: 'yt', name: '🇭🇺 Wellhello - Apuveddmeg', id: '1w7Xw73W4Bc' },
            { type: 'yt', name: '🇭🇺 Bagossy Brothers Company - Olyan Ő', id: '7oJ4HnLq2M8' },
            { type: 'yt', name: '🇭🇺 Majka & Curtis - Belehalok', id: '4H1W7k8gQ1o' },
            { type: 'yt', name: '🇭🇺 Kowalsky meg a Vega - Varázsvilág', id: '0N6w0J8m4rQ' },
            { type: 'yt', name: '🇭🇺 Margaret Island - Eső', id: '3vK1x9Z9W8c' },
            { type: 'yt', name: '🇭🇺 Quimby - Most múlik pontosan', id: '9Q4x2w1_1kE' },
            { type: 'yt', name: '🇬🇧 Coldplay - Viva La Vida', id: 'dvgZkm7_0eM' },
            { type: 'yt', name: '🇬🇧 Imagine Dragons - Believer', id: '7qu1nvxaA0I' },
            { type: 'yt', name: '🇬🇧 Ed Sheeran - Shape of You', id: 'JGwWNGJdvx8' },
            { type: 'yt', name: '🇬🇧 Avicii - Wake Me Up', id: 'IcrbM1l_BoI' },
            { type: 'yt', name: '🇬🇧 Queen - Bohemian Rhapsody', id: 'fJ9rUzIMcZQ' },
            { type: 'yt', name: '🇬🇧 Daft Punk - Get Lucky', id: '5NV6Rdv1a3I' },
            { type: 'yt', name: '🇬🇧 The Weeknd - Blinding Lights', id: '4NRXx6U8ABQ' },
            { type: 'yt', name: '🇬🇧 OneRepublic - Counting Stars', id: 'hT_nvWreIhg' }
        ];
        let ytPlayer = null;
        let isPlaying = false;
        let currentTrackIndex = 0;
        const mainToggleBtn = document.getElementById('main-toggle-btn');
        const playlistTitle = document.getElementById('playlist-title');

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('yt-player', {
                height: '200', width: '200', videoId: tracks[0].id,
                events: { 'onStateChange': onPlayerStateChange }
            });
            radioStateRef.on('value', (snap) => {
                const state = snap.val();
                if(state) syncWithServerState(state);
            });
        }
        function syncWithServerState(state) {
            currentTrackIndex = state.trackIndex;
            playlistTitle.textContent = tracks[currentTrackIndex].name;
            const elapsed = (Date.now() - state.startTime) / 1000;
            if (isPlaying && ytPlayer) ytPlayer.loadVideoById({videoId: tracks[currentTrackIndex].id, startSeconds: elapsed});
        }
        function onPlayerStateChange(e) {
            if (e.data === YT.PlayerState.PLAYING) isPlaying = true;
            else if (e.data === YT.PlayerState.ENDED) {
                if (Date.now() % 2 === 0) { // Simple master election
                    radioStateRef.set({ trackIndex: Math.floor(Math.random()*tracks.length), startTime: Date.now() });
                }
            }
        }
        mainToggleBtn.addEventListener('click', () => {
            if (!isPlaying) { ytPlayer.playVideo(); isPlaying = true; }
            else { ytPlayer.pauseVideo(); isPlaying = false; }
        });
        function setPlaybackSpeed(s, el) { ytPlayer.setPlaybackRate(s); document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active')); el.classList.add('active'); }
    </script>
</body>
</html>
