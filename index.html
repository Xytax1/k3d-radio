<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K3D Rádió</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome ikonok -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Retro Pixel Betűtípus -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        * {
            image-rendering: pixelated;
            font-family: 'Press Start 2P', monospace;
            user-select: none;
        }

        body {
            background-color: #0b0e14;
            min-height: 100vh;
        }

        .mc-card {
            background-color: #866043;
            background-image: url('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/block/dirt.png');
            background-size: 32px 32px;
            border: 5px solid #000000;
            box-shadow: 8px 8px 0px 0px #000000;
        }

        .mc-header {
            background-color: #5c8e32;
            background-image: url('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/block/grass_block_top.png');
            background-size: 32px 32px;
            filter: sepia(1) hue-rotate(50deg) saturate(3) brightness(0.8);
            border-bottom: 5px solid #000000;
        }

        .mc-inner-box {
            background-color: #1e1e1e;
            background-image: url('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/block/deepslate.png');
            background-size: 32px 32px;
            border: 4px solid #000000;
        }

        .btn-mc-play {
            background: #a80000;
            background-image: url('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/block/redstone_block.png');
            background-size: 32px 32px;
            border: 4px solid #000000;
            color: #ffffff;
            text-shadow: 2px 2px #000000;
        }
        .btn-mc-play:hover { filter: brightness(1.2); }

        .btn-mc-stop {
            background: #008b8b;
            background-image: url('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/block/diamond_block.png');
            background-size: 32px 32px;
            border: 4px solid #000000;
            color: #ffffff;
            text-shadow: 2px 2px #000000;
        }
        .btn-mc-stop:hover { filter: brightness(1.2); }

        .speed-btn {
            background-color: #111111;
            border: 2px solid #000;
            color: #aaa;
            font-size: 9px;
            padding: 8px 10px;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }
        .speed-btn.active {
            background-color: #55ff55;
            color: #000;
            border-color: #ffffff;
            font-weight: bold;
        }

        input[type=range] {
            -webkit-appearance: none;
            background: #111111;
            border: 2px solid #000000;
            height: 10px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 22px;
            width: 12px;
            background: #55ff55;
            border: 2px solid #000000;
            cursor: default;
            border-radius: 0px;
        }

        #youtube-player-container {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes livePulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .live-dot {
            animation: livePulse 1.5s infinite;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <!-- Rejtett YouTube Lejátszó -->
    <div id="youtube-player-container">
        <div id="yt-player"></div>
    </div>

    <!-- Rádió Konténer -->
    <div class="mc-card w-full max-w-md text-white text-center relative my-4">
        
        <!-- Fejléc -->
        <div class="mc-header py-7 px-6 text-left">
            <h1 class="text-xl sm:text-2xl text-yellow-300 tracking-wider drop-shadow-[3px_3px_0_#000]">
                K3D RÁDIÓ
            </h1>
        </div>

        <div class="p-6">
            <div class="mc-inner-box p-5 mb-5 text-center">
                <div class="text-[10px] text-white uppercase mb-2 [text-shadow:_1px_1px_0_#000]">JUKEBOX LEJÁTSZÓ</div>
                <div id="playlist-title" class="text-xs sm:text-sm text-yellow-400 truncate mb-3 [text-shadow:_2px_2px_0_#000]">
                    Készenlétben
                </div>
                <div class="text-[10px] text-red-500 font-bold flex items-center justify-center gap-1 [text-shadow:_1px_1px_0_#000]">
                    <span class="live-dot">●</span> ÉLŐ RÁDIÓ
                </div>
            </div>

            <!-- Sebesség -->
            <div class="mb-5 text-left">
                <span class="block text-[10px] text-yellow-300 mb-2 [text-shadow:_1px_1px_0_#000]">SEBESSÉG:</span>
                <div class="flex gap-2">
                    <button class="speed-btn" onclick="setPlaybackSpeed(0.5, this)">0.5x</button>
                    <button class="speed-btn active" onclick="setPlaybackSpeed(1.0, this)">1.0x</button>
                    <button class="speed-btn" onclick="setPlaybackSpeed(1.5, this)">1.5x</button>
                    <button class="speed-btn" onclick="setPlaybackSpeed(2.0, this)">2.0x</button>
                </div>
            </div>

            <!-- Lejátszás Gomb -->
            <div class="mb-5">
                <button id="main-toggle-btn" class="btn-mc-play w-full py-4 px-5 cursor-pointer flex items-center justify-center gap-3 text-sm">
                    <i id="btn-icon" class="fa-solid fa-play"></i>
                    <span id="btn-text">LEJÁTSZÁS</span>
                </button>
            </div>

            <!-- Hangerő -->
            <div class="mc-inner-box p-3.5 flex items-center gap-3">
                <button id="mute-btn" class="text-gray-300 hover:text-white cursor-pointer w-6 text-center">
                    <i id="mute-icon" class="fa-solid fa-volume-high text-sm"></i>
                </button>
                <input type="range" id="volume-slider" min="0" max="100" step="1" value="80" class="w-full cursor-pointer">
            </div>
        </div>
    </div>

    <!-- YouTube API JS -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        // Itt mostantól közvetlenül a TELJES YOUTUBE LINKET adhatod meg!
        const tracks = [
            { name: 'Halott Pénz - Valami van a levegőben', url: 'https://www.youtube.com/watch?v=ArTbyFQpQ_8' },
            { name: 'Follow The Flow - Nem tudja senki', url: 'https://www.youtube.com/watch?v=dMa3-TTGb44' },
            { name: 'Wellhello - Apuveddmeg', url: 'https://www.youtube.com/watch?v=1w7Xw73W4Bc' },
            { name: 'Bagossy Brothers Company - Olyan Ő', url: 'https://www.youtube.com/watch?v=7oJ4HnLq2M8' },
            { name: 'Majka & Curtis - Belehalok', url: 'https://www.youtube.com/watch?v=4H1W7k8gQ1o' },
            { name: 'Margaret Island - Eső', url: 'https://www.youtube.com/watch?v=3vK1x9Z9W8c' },
            { name: 'Kowalsky meg a Vega - Varázsvilág', url: 'https://www.youtube.com/watch?v=0N6w0J8m4rQ' },
            { name: 'Quimby - Most múlik pontosan', url: 'https://www.youtube.com/watch?v=9Q4x2w1_1kE' },
            { name: 'AWS - Viszlát nyár', url: 'https://www.youtube.com/watch?v=W12_1G3W56A' },
            { name: 'ValMar - Úristen', url: 'https://www.youtube.com/watch?v=7qu1nvxaA0I' },
            { name: 'Azahriah x Desh - Pullup', url: 'https://www.youtube.com/watch?v=g0fgtTQY' },
            { name: 'T.Danny - Utolsó alkalom', url: 'https://www.youtube.com/watch?v=1G4isv_Fylg' },
            { name: 'Tankcsapda - Mennyország tourist', url: 'https://www.youtube.com/watch?v=BJceRTvD9Fo' },
            { name: 'Luis Fonsi - Despacito', url: 'https://www.youtube.com/watch?v=kJQP7kiw5Fk' },
            { name: 'Ed Sheeran - Shape of You', url: 'https://www.youtube.com/watch?v=JGwWNGJdvx8' },
            { name: 'The Weeknd - Blinding Lights', url: 'https://www.youtube.com/watch?v=4NRXx6U8ABQ' },
            { name: 'Queen - Bohemian Rhapsody', url: 'https://www.youtube.com/watch?v=fJ9rUzIMcZQ' }
        ];

        // Segédfüggvény, ami automatikusan kinyeri a linkből a videó ID-t (kezel sima és youtu.be linkeket is)
        function getYouTubeId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        let ytPlayer = null;
        let currentTrack = null;
        let isPlaying = false;
        let isPaused = false;
        let isMuted = false;
        let currentSpeed = 1.0;
        let previousVolume = 80;

        const playlistTitle = document.getElementById('playlist-title');
        const mainToggleBtn = document.getElementById('main-toggle-btn');
        const btnIcon = document.getElementById('btn-icon');
        const btnText = document.getElementById('btn-text');
        const volumeSlider = document.getElementById('volume-slider');
        const muteBtn = document.getElementById('mute-btn');
        const muteIcon = document.getElementById('mute-icon');

        function onYouTubeIframeAPIReady() {
            try {
                const firstId = getYouTubeId(tracks[0].url);
                ytPlayer = new YT.Player('yt-player', {
                    height: '200',
                    width: '200',
                    videoId: firstId,
                    playerVars: { 'autoplay': 0, 'controls': 0 },
                    events: { 'onStateChange': onPlayerStateChange, 'onError': onPlayerError }
                });
            } catch (e) {}
        }

        function playClickSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.05);
            } catch (e) {}
        }

        function startPlayback() {
            if (!ytPlayer || typeof ytPlayer.loadVideoById !== 'function') return;

            if (isPaused) {
                ytPlayer.playVideo();
                isPaused = false;
            } else {
                currentTrack = tracks[Math.floor(Math.random() * tracks.length)];
                const videoId = getYouTubeId(currentTrack.url);
                
                if (!videoId) {
                    startPlayback(); // Ha hibás a link, ugorjon a következőre
                    return;
                }

                playlistTitle.textContent = currentTrack.name;
                ytPlayer.loadVideoById(videoId);
                ytPlayer.setPlaybackRate(currentSpeed);
                ytPlayer.setVolume(volumeSlider.value);
                ytPlayer.playVideo();
            }

            isPlaying = true;
            updateUIState(true);
        }

        function stopPlayback() {
            if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
            isPlaying = false;
            isPaused = true;
            updateUIState(false);
        }

        function togglePlayback() {
            playClickSound();
            isPlaying ? stopPlayback() : startPlayback();
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                isPaused = false;
                startPlayback();
            }
        }

        function onPlayerError() {
            isPaused = false;
            startPlayback();
        }

        function updateUIState(playing) {
            if (playing) {
                mainToggleBtn.classList.replace('btn-mc-play', 'btn-mc-stop');
                btnIcon.className = 'fa-solid fa-square';
                btnText.textContent = 'LEÁLLÍTÁS';
            } else {
                mainToggleBtn.classList.replace('btn-mc-stop', 'btn-mc-play');
                btnIcon.className = 'fa-solid fa-play';
                btnText.textContent = 'LEJÁTSZÁS';
            }
        }

        function setPlaybackSpeed(speed, btnElement) {
            playClickSound();
            currentSpeed = speed;
            if (ytPlayer && ytPlayer.setPlaybackRate) ytPlayer.setPlaybackRate(speed);
            document.querySelectorAll('.speed-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');
        }

        mainToggleBtn.addEventListener('click', togglePlayback);

        volumeSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            if (ytPlayer && ytPlayer.setVolume) ytPlayer.setVolume(val);
            muteIcon.className = val == 0 ? 'fa-solid fa-volume-xmark text-red-400 text-sm' : 'fa-solid fa-volume-high text-sm';
        });

        muteBtn.addEventListener('click', () => {
            playClickSound();
            isMuted = !isMuted;
            if (isMuted) {
                previousVolume = volumeSlider.value;
                volumeSlider.value = 0;
                if (ytPlayer && ytPlayer.setVolume) ytPlayer.setVolume(0);
                muteIcon.className = 'fa-solid fa-volume-xmark text-red-400 text-sm';
            } else {
                volumeSlider.value = previousVolume;
                if (ytPlayer && ytPlayer.setVolume) ytPlayer.setVolume(previousVolume);
                muteIcon.className = 'fa-solid fa-volume-high text-sm';
            }
        });
    </script>
</body>
</html>
